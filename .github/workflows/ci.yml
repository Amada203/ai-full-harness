name: Harness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Shell suites
        run: |
          for t in test-autopilot-contract test-autopilot-grant test-autopilot-workflow-static \
                   test-new-full-project test-global-registration test-autopilot-ledger; do
            bash "tests/$t.sh"
          done
      - name: Node suites
        run: |
          # tests/test-architecture.mjs and the lifecycle/refactor suites that
          # exercise the design gate require the pinned local Archify
          # installation (ARCHIFY_HOME), which CI does not attest. Missing
          # tools block design, per the architecture gate; those suites are
          # therefore local attestation evidence only.
          for t in test-continuity test-knowledge-base test-knowledge-sync \
                   test-source-agent-entries; do
            node "tests/$t.mjs"
          done
      - name: Whitespace
        run: git diff --check HEAD~
