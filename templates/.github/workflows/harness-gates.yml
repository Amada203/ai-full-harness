name: Harness lifecycle gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate harness structure
        run: scripts/check-harness.sh
      - name: Enforce fixed GitHub release gate
        run: scripts/check-lifecycle-gate.sh github
